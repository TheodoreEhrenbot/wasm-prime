[package]
name = "wasm-prime"
version = "0.1.0"
authors = ["Theodore Ehrenborg <theodore.ehrenborg@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.84"
console_error_panic_hook = { version = "0.1.7", optional = true }
num-bigint = { version = "0.4.6", features = ["rand"] }
num-iter = "0.1.45"
num-traits = "0.2"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
opt-level = "s"
